aid: cool-planet
name: Cool Planet
description: 'CoolPlanet is an enterprise energy-management and decarbonisation software
  company. Its platform, CoolPlanetOS, centralises real-time energy data across multi-site
  industrial estates, applies AI-driven anomaly detection and efficiency insights,
  benchmarks performance across facilities, and automates energy and compliance reporting.
  CoolPlanet pairs the software with consulting and on-site execution services to help
  manufacturing, pharmaceutical, food and beverage, commercial real estate, mining
  and shipping enterprises cut energy costs and carbon emissions. Backed by GV (Google
  Ventures). No public developer API surface is currently published.'
